name: Audit UI strings

on:
  pull_request:
    branches:
      - test/ru-i18n-omp-telemetry

permissions:
  contents: write

jobs:
  audit:
    if: github.head_ref == 'test/ru-i18n-omp-telemetry-direct'
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v6
        with:
          ref: ${{ github.head_ref }}
      - name: Inventory unmapped UI strings
        run: python3 scripts/audit-ui-strings.py > ui-audit.txt
      - name: Persist report
        shell: bash
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add ui-audit.txt
          if git diff --cached --quiet; then
            exit 0
          fi
          git commit -m "chore(i18n): update UI audit report"
          git push origin HEAD:${{ github.head_ref }}
