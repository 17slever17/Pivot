name: Audit UI strings

on:
  push:
    branches:
      - test/ru-i18n-omp-telemetry-direct

permissions:
  contents: read

jobs:
  audit:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v6
      - name: Inventory unmapped UI strings
        run: python3 scripts/audit-ui-strings.py
