name: Fix Windows shell fallback and format i18n

on:
  pull_request:
    branches:
      - test/ru-i18n-omp-telemetry

permissions:
  contents: write

jobs:
  fix:
    if: github.head_ref == 'test/ru-i18n-omp-telemetry-direct'
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v6
        with:
          ref: ${{ github.head_ref }}
      - uses: voidzero-dev/setup-vp@v1
        with:
          node-version-file: package.json
          cache: true
          run-install: true
      - name: Apply safe Windows PowerShell fallback fix
        shell: bash
        run: |
          python3 - <<'PY'
          from pathlib import Path

          src = Path('apps/desktop/src/shell/DesktopShellEnvironment.ts')
          text = src.read_text(encoding='utf-8')

          replacements = [
              (
                  '  readonly timeout: Duration.Duration;\n  readonly shell?: boolean;\n',
                  '  readonly timeout: Duration.Duration;\n  readonly shell?: boolean;\n  readonly logFailure?: boolean;\n',
              ),
              (
                  '        DesktopShellEnvironmentCommandError: (error) =>\n          logShellEnvironmentCommandError(error).pipe(Effect.as("")),\n',
                  '        DesktopShellEnvironmentCommandError: (error) =>\n          input.logFailure === false\n            ? Effect.succeed("")\n            : logShellEnvironmentCommandError(error).pipe(Effect.as("")),\n',
              ),
              (
                  '  yield* logShellEnvironmentCommandError(error);\n  return "";\n});\n',
                  '  if (input.logFailure !== false) {\n    yield* logShellEnvironmentCommandError(error);\n  }\n  return "";\n});\n',
              ),
              (
                  '    for (const command of WINDOWS_SHELL_CANDIDATES) {\n      const output = yield* runCommandOutput({\n',
                  '    for (const [index, command] of WINDOWS_SHELL_CANDIDATES.entries()) {\n      const output = yield* runCommandOutput({\n',
              ),
              (
                  '        args,\n        timeout: LOGIN_SHELL_TIMEOUT,\n      });\n      const environment = extractEnvironment(output, names);\n',
                  '        args,\n        timeout: LOGIN_SHELL_TIMEOUT,\n        // pwsh.exe is optional on Windows. Only warn if the final Windows\n        // PowerShell fallback also fails.\n        logFailure: index === WINDOWS_SHELL_CANDIDATES.length - 1,\n      });\n      const environment = extractEnvironment(output, names);\n',
              ),
          ]
          for old, new in replacements:
              count = text.count(old)
              if count != 1:
                  raise SystemExit(f'DesktopShellEnvironment.ts anchor mismatch: {count}: {old[:80]!r}')
              text = text.replace(old, new, 1)
          src.write_text(text, encoding='utf-8')

          test = Path('apps/desktop/src/shell/DesktopShellEnvironment.test.ts')
          text = test.read_text(encoding='utf-8')
          old = '''  readonly handler: (command: ChildProcess.Command) => string;\n  readonly failure?: PlatformError.PlatformError;\n}) {\n'''
          new = '''  readonly handler: (command: ChildProcess.Command) => string;\n  readonly failure?: PlatformError.PlatformError;\n  readonly failureForCommand?: (\n    command: ChildProcess.Command,\n  ) => PlatformError.PlatformError | undefined;\n}) {\n'''
          if text.count(old) != 1:
              raise SystemExit('test helper type anchor mismatch')
          text = text.replace(old, new, 1)

          old = '''    ChildProcessSpawner.make((command) =>\n      input.failure === undefined\n        ? Effect.succeed(makeProcess(input.handler(command)))\n        : Effect.fail(input.failure),\n    ),\n'''
          new = '''    ChildProcessSpawner.make((command) => {\n      const failure = input.failureForCommand?.(command) ?? input.failure;\n      return failure === undefined\n        ? Effect.succeed(makeProcess(input.handler(command)))\n        : Effect.fail(failure);\n    }),\n'''
          if text.count(old) != 1:
              raise SystemExit('test helper spawner anchor mismatch')
          text = text.replace(old, new, 1)

          anchor = '''  it.effect("prefers login-shell desktop session hints over inherited values on linux", () =>\n'''
          insert = r'''  it.effect("silently falls back to Windows PowerShell when pwsh is not installed", () => {\n    const env: NodeJS.ProcessEnv = {\n      PATH: "C:\\\\Windows\\\\System32",\n      APPDATA: "C:\\\\Users\\\\testuser\\\\AppData\\\\Roaming",\n      LOCALAPPDATA: "C:\\\\Users\\\\testuser\\\\AppData\\\\Local",\n      USERPROFILE: "C:\\\\Users\\\\testuser",\n    };\n    const cause = PlatformError.systemError({\n      _tag: "NotFound",\n      module: "ChildProcess",\n      method: "spawn",\n      pathOrDescriptor: "pwsh.exe",\n    });\n    const messages: Array<unknown> = [];\n    const logger = Logger.make(({ message }) => {\n      messages.push(message);\n    });\n\n    return runShellEnvironment({\n      env,\n      platform: "win32",\n      handler: () => envOutput({ PATH: "C:\\\\Fallback\\\\Bin;C:\\\\Windows\\\\System32" }),\n      failureForCommand: (command) =>\n        command._tag === "StandardCommand" && command.command === "pwsh.exe" ? cause : undefined,\n    }).pipe(\n      Effect.andThen(\n        Effect.sync(() => {\n          assert.include(env.PATH ?? "", "C:\\\\Fallback\\\\Bin");\n          const errors = messages\n            .flatMap((message) => (Array.isArray(message) ? message : [message]))\n            .filter(isDesktopShellEnvironmentCommandError);\n          assert.lengthOf(errors, 0);\n        }),\n      ),\n      Effect.provide(Logger.layer([logger], { mergeWithExisting: false })),\n    );\n  });\n\n'''
          if text.count(anchor) != 1:
              raise SystemExit('test insertion anchor mismatch')
          text = text.replace(anchor, insert + anchor, 1)
          test.write_text(text, encoding='utf-8')
          PY
      - name: Format and lint fixes
        run: vp check --fix
      - name: Focused Windows shell tests
        run: vp test run apps/desktop/src/shell/DesktopShellEnvironment.test.ts
      - name: Commit generated fixes
        shell: bash
        run: |
          if git diff --quiet; then
            exit 0
          fi
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -A
          git commit -m "fix(desktop): silently fall back when pwsh is unavailable"
          git push origin HEAD:${{ github.head_ref }}
