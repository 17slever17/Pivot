name: Diagnose comprehensive i18n check

on:
  pull_request:
    branches:
      - test/ru-i18n-omp-telemetry

permissions:
  contents: write

jobs:
  diagnose:
    if: github.head_ref == 'test/ru-i18n-omp-telemetry-direct'
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v6
        with:
          ref: ${{ github.head_ref }}
      - uses: voidzero-dev/setup-vp@v1
        with:
          node-version-file: package.json
          cache: true
          run-install: true
      - name: Capture check output
        shell: bash
        run: |
          set +e
          vp check --fix > /tmp/i18n-check.log 2>&1
          rc=$?
          set -e
          printf '\nEXIT_CODE=%s\n' "$rc" >> /tmp/i18n-check.log
          git restore --worktree -- .
          cp /tmp/i18n-check.log i18n-check.log
      - name: Commit diagnostic log
        shell: bash
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add i18n-check.log
          if git diff --cached --quiet; then
            exit 0
          fi
          git commit -m "chore(i18n): capture check diagnostics"
          git push origin HEAD:${{ github.head_ref }}
