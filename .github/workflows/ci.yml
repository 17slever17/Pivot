name: CI

on:
  pull_request:
  push:
    branches:
      - main

concurrency:
  group: ci-${{ github.event.pull_request.number || github.sha }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

jobs:
  check:
    name: Check
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    steps:
      - name: Checkout
        uses: actions/checkout@v6
        with:
          sparse-checkout: |
            /*
            !/.repos/
          sparse-checkout-cone-mode: false

      - name: Setup Vite+
        uses: voidzero-dev/setup-vp@v1
        with:
          node-version-file: package.json
          cache: true
          run-install: true

      - name: Setup Rust
        uses: dtolnay/rust-toolchain@stable
        with:
          components: rustfmt

      - name: Ensure Electron runtime is installed
        run: vp run --filter @t3tools/desktop ensure:electron

      - name: Audit Russian UI localization coverage
        shell: bash
        run: |
          python3 - <<'PY'
          from __future__ import annotations

          from collections import defaultdict
          from pathlib import Path
          import re

          ROOT = Path("apps/web/src")
          REPORT = Path("/tmp/ru-localization-audit.txt")

          def normalize(value: str) -> str:
              return re.sub(r"\s+", " ", value).strip()

          def unescape_js(value: str) -> str:
              return (
                  value.replace(r"\n", "\n")
                  .replace(r"\t", "\t")
                  .replace(r'\"', '"')
                  .replace(r"\'", "'")
                  .replace(r"\\", "\\")
              )

          translation_keys: set[str] = set()
          key_re = re.compile(
              r'^\s*(?:"((?:\\.|[^"\\])*)"|\'((?:\\.|[^\'\\])*)\'|([A-Za-z][A-Za-z0-9_.-]*))\s*:\s*',
              re.MULTILINE,
          )
          for path in sorted((ROOT / "i18n").glob("runtimeRu*.ts")):
              text = path.read_text(encoding="utf-8")
              for match in key_re.finditer(text):
                  raw = next((group for group in match.groups() if group is not None), "")
                  key = normalize(unescape_js(raw))
                  if key:
                      translation_keys.add(key)

          strict_patterns = (
              (
                  "jsx",
                  re.compile(r">([^<>{}\n]*[A-Za-z][^<>{}\n]*)<"),
              ),
              (
                  "prop",
                  re.compile(
                      r'\b(?:title|description|label|placeholder|aria-label|aria-description|aria-valuetext|tooltip|message|helpText|emptyText|caption)\s*=\s*"([^"\n]*[A-Za-z][^"\n]*)"'
                  ),
              ),
              (
                  "object",
                  re.compile(
                      r'\b(?:title|description|label|placeholder|tooltip|message|helpText|emptyText|caption|children)\s*:\s*"([^"\n]*[A-Za-z][^"\n]*)"'
                  ),
              ),
          )
          quoted_re = re.compile(r'"((?:\\.|[^"\\\n]){2,180})"')

          def is_source_file(path: Path) -> bool:
              posix = path.as_posix()
              if not posix.endswith(".tsx"):
                  return False
              if any(token in posix for token in (".test.", ".spec.", "__tests__", "/i18n/")):
                  return False
              if "/components/ui/" in posix:
                  return False
              if posix.endswith("SettingsRuntimeLocalization.tsx"):
                  return False
              return True

          def looks_like_loose_ui(value: str, before: str) -> bool:
              value = normalize(unescape_js(value))
              if not value or not re.search(r"[A-Za-z]", value):
                  return False
              if value in translation_keys:
                  return False
              if value.startswith(("./", "../", "~/", "/", "http://", "https://", "data:")):
                  return False
              if any(marker in before for marker in ("className=", "className:", "import ", " from ", "createFileRoute(")):
                  return False
              if re.fullmatch(r"[a-z0-9_.:/@-]+", value):
                  return False
              if re.fullmatch(r"[A-Fa-f0-9]{8,}", value):
                  return False
              if "${" in value or "{" in value or "}" in value:
                  return False
              if len(value) > 180:
                  return False
              # Keep phrases and short capitalized labels. Lower-case single tokens
              # are mostly enum values / CSS / protocol identifiers.
              return " " in value or value[:1].isupper()

          strict_uncovered: dict[str, list[tuple[int, str, str]]] = defaultdict(list)
          strict_covered: dict[str, int] = defaultdict(int)
          loose_uncovered: dict[str, list[tuple[int, str]]] = defaultdict(list)
          seen_strict: set[tuple[str, int, str]] = set()
          seen_loose: set[tuple[str, int, str]] = set()

          files = [path for path in ROOT.rglob("*.tsx") if is_source_file(path)]
          for path in sorted(files):
              rel = path.as_posix()
              text = path.read_text(encoding="utf-8")
              for kind, pattern in strict_patterns:
                  for match in pattern.finditer(text):
                      value = normalize(unescape_js(match.group(1)))
                      if not value or not re.search(r"[A-Za-z]", value):
                          continue
                      line = text.count("\n", 0, match.start(1)) + 1
                      key = (rel, line, value)
                      if key in seen_strict:
                          continue
                      seen_strict.add(key)
                      if value in translation_keys:
                          strict_covered[rel] += 1
                      else:
                          strict_uncovered[rel].append((line, kind, value))

              for match in quoted_re.finditer(text):
                  value = normalize(unescape_js(match.group(1)))
                  before = text[max(0, match.start() - 80) : match.start()]
                  if not looks_like_loose_ui(value, before):
                      continue
                  line = text.count("\n", 0, match.start(1)) + 1
                  key = (rel, line, value)
                  if key in seen_loose or key in seen_strict:
                      continue
                  seen_loose.add(key)
                  loose_uncovered[rel].append((line, value))

          omp_files = sorted((ROOT / "i18n").glob("runtimeRuOmpSchema*.ts"))
          omp_pair_re = re.compile(
              r'"((?:\\.|[^"\\])+)"\s*:\s*(?:\n\s*)?"((?:\\.|[^"\\])+)"',
              re.MULTILINE,
          )
          omp_pairs: list[tuple[str, str, str]] = []
          omp_suspicious: list[tuple[str, str, str]] = []
          for path in omp_files:
              text = path.read_text(encoding="utf-8")
              for match in omp_pair_re.finditer(text):
                  source = normalize(unescape_js(match.group(1)))
                  target = normalize(unescape_js(match.group(2)))
                  omp_pairs.append((path.name, source, target))
                  if (
                      re.search(r"[A-Za-z]", source)
                      and " " in source
                      and not re.search(r"[А-Яа-яЁё]", target)
                  ):
                      omp_suspicious.append((path.name, source, target))

          ranked = sorted(
              set(strict_uncovered) | set(strict_covered),
              key=lambda file: (-len(strict_uncovered[file]), file),
          )

          with REPORT.open("w", encoding="utf-8") as out:
              out.write(f"Runtime RU exact keys: {len(translation_keys)}\n")
              out.write(f"Audited TSX files: {len(files)}\n")
              out.write(f"Strict uncovered occurrences: {sum(map(len, strict_uncovered.values()))}\n")
              out.write(f"Loose uncovered occurrences: {sum(map(len, loose_uncovered.values()))}\n")
              out.write(f"OMP translated pairs parsed: {len(omp_pairs)}\n")
              out.write(f"OMP targets without Cyrillic: {len(omp_suspicious)}\n\n")

              out.write("=== STRICT COVERAGE BY FILE ===\n")
              for file in ranked:
                  covered = strict_covered[file]
                  uncovered = len(strict_uncovered[file])
                  if covered == 0 and uncovered == 0:
                      continue
                  out.write(f"{uncovered:4d} missing / {covered:4d} covered  {file}\n")

              out.write("\n=== STRICT UNCOVERED ===\n")
              for file in ranked:
                  items = strict_uncovered[file]
                  if not items:
                      continue
                  out.write(f"\n## {file}\n")
                  for line, kind, value in items:
                      out.write(f"L{line} [{kind}] {value}\n")

              out.write("\n=== LOOSE UNCOVERED (manual review candidates) ===\n")
              for file in sorted(loose_uncovered):
                  items = loose_uncovered[file]
                  if not items:
                      continue
                  out.write(f"\n## {file}\n")
                  for line, value in items:
                      out.write(f"L{line} {value}\n")

              out.write("\n=== OMP TARGETS WITHOUT CYRILLIC (manual review) ===\n")
              for file, source, target in omp_suspicious:
                  out.write(f"{file}: {source} => {target}\n")

          print(REPORT.read_text(encoding="utf-8")[:12000])
          PY

      - name: Upload Russian localization audit
        if: always()
        uses: actions/upload-artifact@v7
        with:
          name: ru-localization-audit
          path: /tmp/ru-localization-audit.txt
          if-no-files-found: error
          retention-days: 1

      - name: Check
        run: vp check

      - name: Typecheck
        run: vpr typecheck

      - name: Check resource monitor formatting
        run: cargo fmt --manifest-path native/resource-monitor/Cargo.toml -- --check

      - name: Build desktop pipeline
        run: vp run build:desktop

      - name: Verify preload bundle output
        run: |
          test -f apps/desktop/dist-electron/preload.cjs
          grep -nE "desktopBridge|getLocalEnvironmentBootstrap|PICK_FOLDER_CHANNEL|wsUrl" apps/desktop/dist-electron/preload.cjs
          grep -n "__clerk_internal_electron_passkeys" apps/desktop/dist-electron/preload.cjs

  test:
    name: Test
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    steps:
      - name: Checkout
        uses: actions/checkout@v6
        with:
          sparse-checkout: |
            /*
            !/.repos/
          sparse-checkout-cone-mode: false

      - name: Setup Vite+
        uses: voidzero-dev/setup-vp@v1
        with:
          node-version-file: package.json
          cache: true
          run-install: true

      - name: Setup Rust
        uses: dtolnay/rust-toolchain@stable

      - name: Ensure Electron runtime is installed
        run: vp run --filter @t3tools/desktop ensure:electron

      - name: Test
        env:
          T3CODE_TRANSFER_BUDGET_REPORT_PATH: ${{ runner.temp }}/t3code-transfer-budget.md
          T3CODE_TRANSFER_BUDGET_RESULT_PATH: ${{ runner.temp }}/thread-transfer-result.json
        run: vp run test

      - name: Publish transfer budget report
        if: always()
        run: |
          if test -f "${{ runner.temp }}/t3code-transfer-budget.md"; then
            tee -a "$GITHUB_STEP_SUMMARY" < "${{ runner.temp }}/t3code-transfer-budget.md"
          else
            echo "Transfer budget report was not produced." >> "$GITHUB_STEP_SUMMARY"
          fi

      - name: Upload thread transfer result
        if: always()
        uses: actions/upload-artifact@v7
        with:
          name: thread-transfer-results
          path: ${{ runner.temp }}/thread-transfer-result.json
          if-no-files-found: ignore
          retention-days: 30

      - name: Test resource monitor
        run: cargo test --locked --manifest-path native/resource-monitor/Cargo.toml

  mobile_native_static_analysis:
    name: Mobile Native Static Analysis
    runs-on: macos-15
    timeout-minutes: 10
    steps:
      - name: Checkout
        uses: actions/checkout@v6
        with:
          sparse-checkout: |
            /*
            !/.repos/
          sparse-checkout-cone-mode: false

      - name: Setup Vite+
        uses: voidzero-dev/setup-vp@v1
        with:
          node-version-file: package.json
          cache: true
          run-install: |
            args:
              - --filter=@t3tools/scripts...

      - name: Install mobile native static analysis tools
        run: brew bundle install --file apps/mobile/Brewfile

      - name: Lint mobile native sources
        run: vp run lint:mobile

  release_smoke:
    name: Release Smoke
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    steps:
      - name: Checkout
        uses: actions/checkout@v6
        with:
          sparse-checkout: |
            /*
            !/.repos/
          sparse-checkout-cone-mode: false

      - name: Setup Vite+
        uses: voidzero-dev/setup-vp@v1
        with:
          node-version-file: package.json
          cache: true
          run-install: |
            args:
              - --filter=@t3tools/scripts...

      - name: Exercise release-only workflow steps
        run: node scripts/release-smoke.ts
