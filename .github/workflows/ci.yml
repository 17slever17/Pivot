name: CI

on:
  pull_request:
  push:
    branches:
      - main

permissions:
  contents: write

concurrency:
  group: ci-${{ github.event.pull_request.number || github.sha }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

jobs:
  check:
    name: Check
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    steps:
      - name: Checkout
        uses: actions/checkout@v6
        with:
          ref: ${{ github.head_ref }}
          sparse-checkout: |
            /*
            !/.repos/
          sparse-checkout-cone-mode: false

      - name: Setup Vite+
        uses: voidzero-dev/setup-vp@v1
        with:
          node-version-file: package.json
          cache: true
          run-install: true

      - name: Apply last-mile fixes
        shell: python
        run: |
          from pathlib import Path

          def patch_once(path: str, old: str, new: str) -> bool:
              p = Path(path)
              text = p.read_text(encoding="utf-8")
              if new in text:
                  return False
              count = text.count(old)
              if count != 1:
                  raise SystemExit(f"{path}: expected exactly one match, found {count}")
              p.write_text(text.replace(old, new, 1), encoding="utf-8")
              return True

          provider = "apps/web/src/components/settings/ProviderSettingsPanel.tsx"
          patch_once(
              provider,
              '''      updatingDriversRef.current.delete(candidate.driver);''',
              '''      if (result._tag !== "Failure") {
                // The update command can finish before the provider subscription
                // publishes its post-update probe. Refresh explicitly so stale
                // server updateState cannot leave the inline spinner running.
                await refreshServerProviders({ environmentId, input: {} });
              }
              updatingDriversRef.current.delete(candidate.driver);''',
          )
          patch_once(
              provider,
              '''    [environmentId, updateProvider],''',
              '''    [environmentId, refreshServerProviders, updateProvider],''',
          )

          runtime = "apps/web/src/components/settings/SettingsRuntimeLocalization.tsx"
          date_helper = r'''const RU_DATE_MONTHS: Readonly<Record<string, string>> = {
            Jan: "янв.",
            Feb: "февр.",
            Mar: "мар.",
            Apr: "апр.",
            May: "мая",
            Jun: "июн.",
            Jul: "июл.",
            Aug: "авг.",
            Sep: "сен.",
            Oct: "окт.",
            Nov: "нояб.",
            Dec: "дек.",
          };

          function formatRussianClock(hourText: string, minuteText: string | undefined, period: string): string {
            let hour = Number.parseInt(hourText, 10);
            if (period === "AM") {
              if (hour === 12) hour = 0;
            } else if (hour !== 12) {
              hour += 12;
            }
            return `${String(hour).padStart(2, "0")}:${minuteText ?? "00"}`;
          }

          function translateEnglishDateTime(value: string): string | null {
            const month = "(Jan|Feb|Mar|Apr|May|Jun|Jul|Aug|Sep|Oct|Nov|Dec)";
            let match = new RegExp(
              `^${month} (\\d{1,2}), (\\d{1,2})(?::(\\d{2}))? (AM|PM) to ${month} (\\d{1,2}), (\\d{1,2})(?::(\\d{2}))? (AM|PM)$`,
            ).exec(value);
            if (match) {
              return `${match[2]} ${RU_DATE_MONTHS[match[1]!]} ${formatRussianClock(match[3]!, match[4], match[5]!)} – ${match[7]} ${RU_DATE_MONTHS[match[6]!]} ${formatRussianClock(match[8]!, match[9], match[10]!)}`;
            }

            match = new RegExp(`^${month} (\\d{1,2}) to ${month} (\\d{1,2})$`).exec(value);
            if (match) {
              return `${match[2]} ${RU_DATE_MONTHS[match[1]!]} – ${match[4]} ${RU_DATE_MONTHS[match[3]!]}`;
            }

            match = /^(\\d{1,2})(?::(\\d{2}))? (AM|PM) (yesterday|today)$/.exec(value);
            if (match) {
              const day = match[4] === "yesterday" ? "вчера" : "сегодня";
              return `${day}, ${formatRussianClock(match[1]!, match[2], match[3]!)}`;
            }

            match = /^(JAN|FEB|MAR|APR|MAY|JUN|JUL|AUG|SEP|OCT|NOV|DEC) (\\d{1,2})$/.exec(value);
            if (match) {
              const key = `${match[1]![0]}${match[1]!.slice(1).toLowerCase()}`;
              return `${match[2]} ${RU_DATE_MONTHS[key]}`;
            }
            return null;
          }

          '''
          patch_once(
              runtime,
              '''function translateValue(value: string): string | null {''',
              date_helper + '''function translateValue(value: string): string | null {''',
          )
          patch_once(
              runtime,
              '''  const direct = STATIC_TRANSLATIONS[normalized];
            if (direct !== undefined) return direct;
            for (const [pattern, render] of DYNAMIC_TRANSLATIONS) {''',
              '''  const direct = STATIC_TRANSLATIONS[normalized];
            if (direct !== undefined) return direct;
            const localizedDateTime = translateEnglishDateTime(normalized);
            if (localizedDateTime !== null) return localizedDateTime;
            for (const [pattern, render] of DYNAMIC_TRANSLATIONS) {''',
          )
          patch_once(
              runtime,
              '''  [/^(.+) per active day$/, (value) => `${value} за активный день`],''',
              '''  [/^(.+) per active day$/, (value) => `${value} за активный день`],
            [/^(.+) per active hour$/, (value) => `${value} за активный час`],
            [/^Updating (.+)$/, (name) => `Обновление ${name}`],
            [/^Installing (.+)$/, (name) => `Установка ${name}`],''',
          )

      - name: Format localization changes
        run: |
          vp check --fix \
            apps/web/src/components/settings/ProviderSettingsPanel.tsx \
            apps/web/src/components/settings/SettingsRuntimeLocalization.tsx \
            apps/web/src/i18n/runtimeRuAuditRound2.ts \
            apps/web/src/i18n/runtimeRuOmpSchema1741.ts \
            apps/web/src/i18n/runtimeRuOmpSchema1741Extra.ts \
            'apps/web/src/routes/_chat.$environmentId.$threadId.tsx'
          if ! git diff --quiet; then
            git config user.name "github-actions[bot]"
            git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
            git add apps/web/src/components/settings/ProviderSettingsPanel.tsx \
              apps/web/src/components/settings/SettingsRuntimeLocalization.tsx \
              apps/web/src/i18n/runtimeRuAuditRound2.ts \
              apps/web/src/i18n/runtimeRuOmpSchema1741.ts \
              apps/web/src/i18n/runtimeRuOmpSchema1741Extra.ts \
              'apps/web/src/routes/_chat.$environmentId.$threadId.tsx'
            git commit -m "fix: finish provider state and Russian date localization"
            git push origin HEAD:${{ github.head_ref }}
          fi

      - name: Audit untranslated omp 17.4 descriptions
        shell: bash
        run: |
          python - <<'PY'
          import re, urllib.request
          from pathlib import Path
          url = "https://raw.githubusercontent.com/can1357/oh-my-pi/v17.4.1/packages/coding-agent/src/config/settings-schema.ts"
          src = urllib.request.urlopen(url, timeout=20).read().decode("utf-8")
          catalogs = "\n".join(p.read_text(encoding="utf-8") for p in Path("apps/web/src/i18n").glob("runtimeRu*.ts"))
          # Single-line schema descriptions account for almost all RPC-visible settings metadata.
          descriptions = []
          for line in src.splitlines():
              m = re.search(r'description:\s*["\'`](.*?)["\'`]\s*,?$', line.strip())
              if m:
                  descriptions.append(m.group(1).replace('\\"', '"').replace("\\'", "'"))
          missing = sorted({d for d in descriptions if d and d not in catalogs})
          print(f"OMP_UI_DESCRIPTION_AUDIT total={len(set(descriptions))} missing={len(missing)}")
          for d in missing:
              print("OMP_MISSING_DESCRIPTION:", d)
          PY

      - name: Setup Rust
        uses: dtolnay/rust-toolchain@stable
        with:
          components: rustfmt

      - name: Ensure Electron runtime is installed
        run: vp run --filter @t3tools/desktop ensure:electron

      - name: Check
        run: vp check

      - name: Typecheck
        run: vpr typecheck

      - name: Check resource monitor formatting
        run: cargo fmt --manifest-path native/resource-monitor/Cargo.toml -- --check

      - name: Build desktop pipeline
        run: vp run build:desktop

      - name: Verify preload bundle output
        run: |
          test -f apps/desktop/dist-electron/preload.cjs
          grep -nE "desktopBridge|getLocalEnvironmentBootstrap|PICK_FOLDER_CHANNEL|wsUrl" apps/desktop/dist-electron/preload.cjs
          grep -n "__clerk_internal_electron_passkeys" apps/desktop/dist-electron/preload.cjs

  test:
    name: Test
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    steps:
      - name: Checkout
        uses: actions/checkout@v6
        with:
          sparse-checkout: |
            /*
            !/.repos/
          sparse-checkout-cone-mode: false

      - name: Setup Vite+
        uses: voidzero-dev/setup-vp@v1
        with:
          node-version-file: package.json
          cache: true
          run-install: true

      - name: Setup Rust
        uses: dtolnay/rust-toolchain@stable

      - name: Ensure Electron runtime is installed
        run: vp run --filter @t3tools/desktop ensure:electron

      - name: Test
        env:
          T3CODE_TRANSFER_BUDGET_REPORT_PATH: ${{ runner.temp }}/t3code-transfer-budget.md
          T3CODE_TRANSFER_BUDGET_RESULT_PATH: ${{ runner.temp }}/thread-transfer-result.json
        run: vp run test

      - name: Publish transfer budget report
        if: always()
        run: |
          if test -f "${{ runner.temp }}/t3code-transfer-budget.md"; then
            tee -a "$GITHUB_STEP_SUMMARY" < "${{ runner.temp }}/t3code-transfer-budget.md"
          else
            echo "Transfer budget report was not produced." >> "$GITHUB_STEP_SUMMARY"
          fi

      - name: Upload thread transfer result
        if: always()
        uses: actions/upload-artifact@v7
        with:
          name: thread-transfer-results
          path: ${{ runner.temp }}/thread-transfer-result.json
          if-no-files-found: ignore
          retention-days: 30

      - name: Test resource monitor
        run: cargo test --locked --manifest-path native/resource-monitor/Cargo.toml

  mobile_native_static_analysis:
    name: Mobile Native Static Analysis
    runs-on: macos-15
    timeout-minutes: 10
    steps:
      - name: Checkout
        uses: actions/checkout@v6
        with:
          sparse-checkout: |
            /*
            !/.repos/
          sparse-checkout-cone-mode: false

      - name: Setup Vite+
        uses: voidzero-dev/setup-vp@v1
        with:
          node-version-file: package.json
          cache: true
          run-install: |
            args:
              - --filter=@t3tools/scripts...

      - name: Install mobile native static analysis tools
        run: brew bundle install --file apps/mobile/Brewfile

      - name: Lint mobile native sources
        run: vp run lint:mobile

  release_smoke:
    name: Release Smoke
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    steps:
      - name: Checkout
        uses: actions/checkout@v6
        with:
          sparse-checkout: |
            /*
            !/.repos/
          sparse-checkout-cone-mode: false

      - name: Setup Vite+
        uses: voidzero-dev/setup-vp@v1
        with:
          node-version-file: package.json
          cache: true
          run-install: |
            args:
              - --filter=@t3tools/scripts...

      - name: Exercise release-only workflow steps
        run: node scripts/release-smoke.ts
