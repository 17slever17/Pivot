name: CI

on:
  pull_request:
  push:
    branches:
      - main

permissions:
  contents: write

concurrency:
  group: ci-${{ github.event.pull_request.number || github.sha }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

jobs:
  check:
    name: Check
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    steps:
      - name: Checkout
        uses: actions/checkout@v6
        with:
          ref: ${{ github.head_ref }}
          sparse-checkout: |
            /*
            !/.repos/
          sparse-checkout-cone-mode: false

      - name: Setup Vite+
        uses: voidzero-dev/setup-vp@v1
        with:
          node-version-file: package.json
          cache: true
          run-install: true

      - name: Apply provider update refresh fix
        shell: python
        run: |
          from pathlib import Path
          path = Path("apps/web/src/components/settings/ProviderSettingsPanel.tsx")
          text = path.read_text(encoding="utf-8")
          marker = 'await refreshServerProviders({ environmentId, input: {} });\n      }\n      updatingDriversRef.current.delete(candidate.driver);'
          if marker not in text:
              old = '      updatingDriversRef.current.delete(candidate.driver);'
              if text.count(old) != 1:
                  raise SystemExit(f"provider delete marker count={text.count(old)}")
              new = '''      if (result._tag !== "Failure") {
                // The update command can finish before the provider subscription
                // publishes its post-update probe. Refresh explicitly so stale
                // server updateState cannot leave the inline spinner running.
                await refreshServerProviders({ environmentId, input: {} });
              }
              updatingDriversRef.current.delete(candidate.driver);'''
              text = text.replace(old, new, 1)
              deps_old = '    [environmentId, updateProvider],'
              deps_new = '    [environmentId, refreshServerProviders, updateProvider],'
              if text.count(deps_old) != 1:
                  raise SystemExit(f"provider deps marker count={text.count(deps_old)}")
              text = text.replace(deps_old, deps_new, 1)
              path.write_text(text, encoding="utf-8")

      - name: Format and persist focused changes
        run: |
          vp check --fix \
            apps/web/src/components/settings/ProviderSettingsPanel.tsx \
            apps/web/src/components/settings/SettingsRuntimeLocalization.tsx \
            apps/web/src/i18n/runtimeRuAuditRound2.ts \
            apps/web/src/i18n/runtimeRuOmpSchema1741.ts \
            apps/web/src/i18n/runtimeRuOmpSchema1741Extra.ts \
            'apps/web/src/routes/_chat.$environmentId.$threadId.tsx'
          if ! git diff --quiet; then
            git config user.name "github-actions[bot]"
            git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
            git add apps/web/src/components/settings/ProviderSettingsPanel.tsx \
              apps/web/src/components/settings/SettingsRuntimeLocalization.tsx \
              apps/web/src/i18n/runtimeRuAuditRound2.ts \
              apps/web/src/i18n/runtimeRuOmpSchema1741.ts \
              apps/web/src/i18n/runtimeRuOmpSchema1741Extra.ts \
              'apps/web/src/routes/_chat.$environmentId.$threadId.tsx'
            git commit -m "fix: refresh provider state after updates"
            git push --no-verify origin HEAD:${{ github.head_ref }}
          fi

      - name: Audit untranslated omp 17.4 descriptions
        shell: bash
        run: |
          python - <<'PY'
          import re, urllib.request
          from pathlib import Path
          url = "https://raw.githubusercontent.com/can1357/oh-my-pi/v17.4.1/packages/coding-agent/src/config/settings-schema.ts"
          src = urllib.request.urlopen(url, timeout=20).read().decode("utf-8")
          catalogs = "\n".join(p.read_text(encoding="utf-8") for p in Path("apps/web/src/i18n").glob("runtimeRu*.ts"))
          descriptions = []
          for line in src.splitlines():
              m = re.search(r'description:\s*["\'`](.*?)["\'`]\s*,?$', line.strip())
              if m:
                  descriptions.append(m.group(1).replace('\\"', '"').replace("\\'", "'"))
          missing = sorted({d for d in descriptions if d and d not in catalogs})
          print(f"OMP_UI_DESCRIPTION_AUDIT total={len(set(descriptions))} missing={len(missing)}")
          for d in missing:
              print("OMP_MISSING_DESCRIPTION:", d)
          PY

      - name: Setup Rust
        uses: dtolnay/rust-toolchain@stable
        with:
          components: rustfmt

      - name: Ensure Electron runtime is installed
        run: vp run --filter @t3tools/desktop ensure:electron

      - name: Check
        run: vp check

      - name: Typecheck
        run: vpr typecheck

      - name: Check resource monitor formatting
        run: cargo fmt --manifest-path native/resource-monitor/Cargo.toml -- --check

      - name: Build desktop pipeline
        run: vp run build:desktop

      - name: Verify preload bundle output
        run: |
          test -f apps/desktop/dist-electron/preload.cjs
          grep -nE "desktopBridge|getLocalEnvironmentBootstrap|PICK_FOLDER_CHANNEL|wsUrl" apps/desktop/dist-electron/preload.cjs
          grep -n "__clerk_internal_electron_passkeys" apps/desktop/dist-electron/preload.cjs

  test:
    name: Test
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    steps:
      - name: Checkout
        uses: actions/checkout@v6
        with:
          sparse-checkout: |
            /*
            !/.repos/
          sparse-checkout-cone-mode: false

      - name: Setup Vite+
        uses: voidzero-dev/setup-vp@v1
        with:
          node-version-file: package.json
          cache: true
          run-install: true

      - name: Setup Rust
        uses: dtolnay/rust-toolchain@stable

      - name: Ensure Electron runtime is installed
        run: vp run --filter @t3tools/desktop ensure:electron

      - name: Test
        env:
          T3CODE_TRANSFER_BUDGET_REPORT_PATH: ${{ runner.temp }}/t3code-transfer-budget.md
          T3CODE_TRANSFER_BUDGET_RESULT_PATH: ${{ runner.temp }}/thread-transfer-result.json
        run: vp run test

      - name: Publish transfer budget report
        if: always()
        run: |
          if test -f "${{ runner.temp }}/t3code-transfer-budget.md"; then
            tee -a "$GITHUB_STEP_SUMMARY" < "${{ runner.temp }}/t3code-transfer-budget.md"
          else
            echo "Transfer budget report was not produced." >> "$GITHUB_STEP_SUMMARY"
          fi

      - name: Upload thread transfer result
        if: always()
        uses: actions/upload-artifact@v7
        with:
          name: thread-transfer-results
          path: ${{ runner.temp }}/thread-transfer-result.json
          if-no-files-found: ignore
          retention-days: 30

      - name: Test resource monitor
        run: cargo test --locked --manifest-path native/resource-monitor/Cargo.toml

  mobile_native_static_analysis:
    name: Mobile Native Static Analysis
    runs-on: macos-15
    timeout-minutes: 10
    steps:
      - name: Checkout
        uses: actions/checkout@v6
        with:
          sparse-checkout: |
            /*
            !/.repos/
          sparse-checkout-cone-mode: false

      - name: Setup Vite+
        uses: voidzero-dev/setup-vp@v1
        with:
          node-version-file: package.json
          cache: true
          run-install: |
            args:
              - --filter=@t3tools/scripts...

      - name: Install mobile native static analysis tools
        run: brew bundle install --file apps/mobile/Brewfile

      - name: Lint mobile native sources
        run: vp run lint:mobile

  release_smoke:
    name: Release Smoke
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    steps:
      - name: Checkout
        uses: actions/checkout@v6
        with:
          sparse-checkout: |
            /*
            !/.repos/
          sparse-checkout-cone-mode: false

      - name: Setup Vite+
        uses: voidzero-dev/setup-vp@v1
        with:
          node-version-file: package.json
          cache: true
          run-install: |
            args:
              - --filter=@t3tools/scripts...

      - name: Exercise release-only workflow steps
        run: node scripts/release-smoke.ts
