name: Format final localization files

on:
  push:
    branches:
      - test/ru-i18n-omp-telemetry-direct
    paths:
      - .github/workflows/apply-settings-i18n-round2.yml
      - .github/workflows/ci.yml
      - apps/web/src/components/settings/SettingsRuntimeLocalization.tsx
      - apps/web/src/i18n/runtimeRuAuditRound2.ts
      - apps/web/src/i18n/runtimeRuOmpSchema1741MissingA.ts
      - apps/web/src/i18n/runtimeRuOmpSchema1741MissingB.ts

permissions:
  contents: write

concurrency:
  group: format-final-localization
  cancel-in-progress: false

jobs:
  format:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-24.04
    steps:
      - name: Checkout localization branch
        uses: actions/checkout@v6
        with:
          ref: test/ru-i18n-omp-telemetry-direct
          fetch-depth: 0

      - name: Setup Vite+
        uses: voidzero-dev/setup-vp@v1
        with:
          node-version-file: package.json
          cache: true
          run-install: true

      - name: Format touched files
        run: >-
          pnpm exec oxfmt --write
          .github/workflows/ci.yml
          apps/web/src/components/settings/SettingsRuntimeLocalization.tsx
          apps/web/src/i18n/runtimeRuAuditRound2.ts
          apps/web/src/i18n/runtimeRuOmpSchema1741MissingA.ts
          apps/web/src/i18n/runtimeRuOmpSchema1741MissingB.ts

      - name: Remove temporary formatter and commit
        shell: bash
        run: |
          rm -f .github/workflows/apply-settings-i18n-round2.yml
          git config user.name github-actions[bot]
          git config user.email 41898282+github-actions[bot]@users.noreply.github.com
          git add -A
          git diff --cached --check
          if git diff --cached --quiet; then
            exit 0
          fi
          git commit -m "chore(i18n): format complete localization catalog"
          git push origin HEAD:test/ru-i18n-omp-telemetry-direct
