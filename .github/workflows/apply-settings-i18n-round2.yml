name: Apply settings i18n round 2

on:
  push:
    branches:
      - test/ru-i18n-omp-telemetry
    paths:
      - scripts/apply_settings_i18n_round2.py
      - .github/workflows/apply-settings-i18n-round2.yml

permissions:
  contents: write

concurrency:
  group: settings-i18n-round2
  cancel-in-progress: false

jobs:
  apply:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: test/ru-i18n-omp-telemetry
          fetch-depth: 0

      - uses: pnpm/action-setup@v4
        with:
          version: 11.10.0

      - uses: actions/setup-node@v4
        with:
          node-version: 24.13.1
          cache: pnpm

      - name: Apply patch
        run: python3 scripts/apply_settings_i18n_round2.py

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: Focused tests
        run: pnpm exec vp test run apps/web/src/i18n.test.ts apps/desktop/src/shell/DesktopShellEnvironment.test.ts

      - name: Check
        run: pnpm exec vp check

      - name: Remove bootstrap files and commit
        shell: bash
        run: |
          rm -f scripts/apply_settings_i18n_round2.py .github/workflows/apply-settings-i18n-round2.yml
          git config user.name github-actions[bot]
          git config user.email 41898282+github-actions[bot]@users.noreply.github.com
          git add -A
          git diff --cached --check
          git commit -m "feat(i18n): expand Russian settings coverage and quiet pwsh fallback"
          git push origin HEAD:test/ru-i18n-omp-telemetry
