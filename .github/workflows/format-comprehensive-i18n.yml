name: Restore unrelated formatter fixes

on:
  pull_request:
    branches:
      - test/ru-i18n-omp-telemetry

permissions:
  contents: write

jobs:
  restore:
    if: github.head_ref == 'test/ru-i18n-omp-telemetry-direct'
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v6
        with:
          ref: ${{ github.head_ref }}
          fetch-depth: 0
      - name: Restore non-localization files from base
        shell: bash
        run: |
          git fetch origin test/ru-i18n-omp-telemetry
          git restore --source=origin/test/ru-i18n-omp-telemetry -- \
            apps/server/src/pullRequest/GitHubPullRequestCli.ts \
            apps/server/src/pullRequest/PullRequestService.ts \
            apps/web/src/components/pullRequest/pullRequestList.logic.ts \
            apps/web/src/components/pullRequest/pullRequestPresentation.tsx
          if git diff --quiet; then
            exit 0
          fi
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -A
          git commit -m "chore(i18n): revert unrelated formatter autofixes"
          git push --no-verify origin HEAD:${{ github.head_ref }}
