name: Format comprehensive i18n

on:
  pull_request:
    branches:
      - test/ru-i18n-omp-telemetry

permissions:
  contents: write

jobs:
  format:
    if: github.head_ref == 'test/ru-i18n-omp-telemetry-direct'
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v6
        with:
          ref: ${{ github.head_ref }}
      - uses: voidzero-dev/setup-vp@v1
        with:
          node-version-file: package.json
          cache: true
          run-install: true
      - name: Format and autofix
        run: vp check --fix
      - name: Commit formatting
        shell: bash
        run: |
          if git diff --quiet; then
            exit 0
          fi
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -A
          git commit -m "style(i18n): format comprehensive localization"
          git push origin HEAD:${{ github.head_ref }}
