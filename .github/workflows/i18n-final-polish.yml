name: Final localization polish

on:
  push:
    branches:
      - test/ru-i18n-omp-telemetry-direct

permissions:
  contents: write

jobs:
  polish:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v6
        with:
          ref: test/ru-i18n-omp-telemetry-direct
      - name: Localize remaining native desktop strings
        shell: bash
        run: |
          python3 - <<'PY'
          from pathlib import Path

          path = Path("apps/desktop/src/window/DesktopWindow.ts")
          text = path.read_text(encoding="utf-8")
          replacements = {
              '<div class="label">Connecting to WSL…</div>': '<div class="label">Подключение к WSL…</div>',
              'menuTemplate.push({ label: "No suggestions", enabled: false });': 'menuTemplate.push({ label: "Нет вариантов", enabled: false });',
              'label: "Copy Link",': 'label: "Копировать ссылку",',
              'label: "Copy Image",': 'label: "Копировать изображение",',
              '{ role: "cut", enabled: params.editFlags.canCut },': '{ role: "cut", label: "Вырезать", enabled: params.editFlags.canCut },',
              '{ role: "copy", enabled: params.editFlags.canCopy },': '{ role: "copy", label: "Копировать", enabled: params.editFlags.canCopy },',
              '{ role: "paste", enabled: params.editFlags.canPaste },': '{ role: "paste", label: "Вставить", enabled: params.editFlags.canPaste },',
              '{ role: "selectAll", enabled: params.editFlags.canSelectAll },': '{ role: "selectAll", label: "Выделить всё", enabled: params.editFlags.canSelectAll },',
          }
          changed = False
          for old, new in replacements.items():
              if old in text:
                  text = text.replace(old, new)
                  changed = True
              elif new not in text:
                  raise SystemExit(f"Missing DesktopWindow anchor: {old!r}")
          if changed:
              path.write_text(text, encoding="utf-8")
          PY
      - name: Commit native localization
        shell: bash
        run: |
          if git diff --quiet; then
            exit 0
          fi
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add apps/desktop/src/window/DesktopWindow.ts
          git commit -m "feat(i18n): localize native desktop context menu and splash"
          git push --no-verify origin HEAD:test/ru-i18n-omp-telemetry-direct
