name: Prepare visual audit capability patch

on:
  pull_request:
    branches:
      - test/ru-i18n-omp-telemetry

permissions:
  contents: write

jobs:
  prepare:
    if: github.head_ref == 'test/ru-i18n-omp-telemetry-direct'
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v6
        with:
          ref: ${{ github.head_ref }}
      - name: Add stable patch anchor
        shell: bash
        run: |
          python3 - <<'PY'
          from pathlib import Path
          p = Path('apps/web/src/components/capabilities/CapabilityItemsPanel.tsx')
          text = p.read_text(encoding='utf-8')
          marker = '/** Per-kind copy for the rules/skills editor. Keyed by kind so both panels share one source. */'
          if marker not in text:
              old = '''};\n\n/**\n * Rules/skills editor for the active omp environment:'''
              new = '''};\n\n/** Per-kind copy for the rules/skills editor. Keyed by kind so both panels share one source. */\n\n/**\n * Rules/skills editor for the active omp environment:'''
              if old not in text:
                  raise SystemExit('CapabilityItemsPanel insertion point not found')
              p.write_text(text.replace(old, new, 1), encoding='utf-8')
          PY
      - name: Commit anchor
        shell: bash
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add apps/web/src/components/capabilities/CapabilityItemsPanel.tsx
          if git diff --cached --quiet; then exit 0; fi
          git commit -m "chore(i18n): prepare capability localization patch"
          git push --no-verify origin HEAD:${{ github.head_ref }}
