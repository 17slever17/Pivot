name: Fix missing omp startup

on:
  push:
    branches:
      - test/ru-i18n-omp-telemetry
    paths:
      - .github/workflows/fix-missing-omp-startup.yml

permissions:
  contents: write

jobs:
  apply:
    name: Apply and verify missing omp startup fix
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    steps:
      - name: Checkout
        uses: actions/checkout@v6
        with:
          ref: test/ru-i18n-omp-telemetry
          fetch-depth: 0

      - name: Setup Vite+
        uses: voidzero-dev/setup-vp@v1
        with:
          node-version-file: package.json
          cache: true
          run-install: true

      - name: Apply fix
        run: python .github/fix-missing-omp-startup.py

      - name: Focused OmpDriver tests
        run: vp test run apps/server/src/provider/Drivers/OmpDriver.test.ts

      - name: Validate diff
        run: git diff --check

      - name: Remove bootstrap files
        run: |
          rm -f .github/fix-missing-omp-startup.py
          rm -f .github/workflows/fix-missing-omp-startup.yml

      - name: Commit fix
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -A
          git status --short
          git commit -m "fix(omp): keep startup alive when omp is missing"

      - name: Typecheck
        run: vpr typecheck

      - name: Push verified commit
        run: git push --no-verify origin HEAD:test/ru-i18n-omp-telemetry
