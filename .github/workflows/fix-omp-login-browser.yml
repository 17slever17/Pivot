name: Fix omp login browser

on:
  push:
    branches:
      - test/ru-i18n-omp-telemetry-direct

permissions:
  contents: write

jobs:
  patch:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v6
        with:
          ref: test/ru-i18n-omp-telemetry-direct
          fetch-depth: 0
      - uses: voidzero-dev/setup-vp@v1
        with:
          node-version-file: package.json
          cache: true
          run-install: true
      - name: Apply browser-launch fix
        shell: python
        run: |
          from pathlib import Path

          launcher = Path('apps/server/src/process/externalLauncher.ts')
          text = launcher.read_text(encoding='utf-8')
          text = text.replace('import * as Encoding from "effect/Encoding";\n', '')
          text = text.replace('''const POWERSHELL_ARGUMENTS_PREFIX = [
            "-NoProfile",
            "-NonInteractive",
            "-ExecutionPolicy",
            "Bypass",
            "-EncodedCommand",
          ] as const;

          ''', '')
          start = text.index('function encodeUtf16LeBase64(')
          end = text.index('function shouldUseWindowsBrowserFromWsl(', start)
          text = text[:start] + '''function resolveWindowsSystemExecutable(
            executable: string,
            env: NodeJS.ProcessEnv = {},
          ): string {
            return `${env.SYSTEMROOT || env.windir || String.raw`C:\\Windows`}\\\\System32\\\\${executable}`;
          }

          function resolveWslWindowsSystemExecutable(executable: string): string {
            return `/mnt/c/Windows/System32/${executable}`;
          }

          ''' + text[end:]
          old = '''function resolveWindowsBrowserLaunch(target: string, command: string): ProcessLaunch {
            const encodedCommand = encodeUtf16LeBase64(
              `$ProgressPreference = 'SilentlyContinue'; Start ${escapePowerShellStringLiteral(target)}`,
            );
            return {
              command,
              args: [...POWERSHELL_ARGUMENTS_PREFIX, encodedCommand],
              options: {
                detached: true,
                shell: false,
                stdin: "ignore",
                stdout: "ignore",
                stderr: "ignore",
              },
            };
          }
          '''
          new = '''function resolveWindowsBrowserLaunch(target: string, command: string): ProcessLaunch {
            return {
              command,
              args: ["url.dll,FileProtocolHandler", target],
              options: DETACHED_IGNORE_STDIO_OPTIONS,
            };
          }
          '''
          if old not in text:
            raise SystemExit('resolveWindowsBrowserLaunch anchor not found')
          text = text.replace(old, new, 1)
          text = text.replace(
            'return resolveWindowsBrowserLaunch(target, resolvePowerShellPath(env));',
            'return resolveWindowsBrowserLaunch(target, resolveWindowsSystemExecutable("rundll32.exe", env));',
          )
          text = text.replace(
            'return resolveWindowsBrowserLaunch(target, resolveWslPowerShellPath());',
            'return resolveWindowsBrowserLaunch(target, resolveWslWindowsSystemExecutable("rundll32.exe"));',
          )
          launcher.write_text(text, encoding='utf-8')

          test = Path('apps/server/src/process/externalLauncher.test.ts')
          text = test.read_text(encoding='utf-8')
          anchor = '''it.effect("launches an installed editor with platform-safe arguments", () =>
          '''
          case = '''it.effect("launches the default browser through the Windows URL handler", () => {
            let spawned: ChildProcess.StandardCommand | undefined;
            let didUnref = false;
            return Effect.gen(function* () {
              const launcher = yield* ExternalLauncher.ExternalLauncher;

              yield* launcher.launchBrowser("https://example.com/oauth?x=1&y=2");

              assert.ok(spawned);
              assert.equal(spawned.command, "C:\\\\Windows\\\\System32\\\\rundll32.exe");
              assert.deepEqual(spawned.args, [
                "url.dll,FileProtocolHandler",
                "https://example.com/oauth?x=1&y=2",
              ]);
              assert.equal(spawned.options.detached, true);
              assert.equal(spawned.options.shell, undefined);
              assert.equal(didUnref, true);
            }).pipe(
              Effect.provide(
                testLayer({
                  platform: "win32",
                  env: { SYSTEMROOT: "C:\\\\Windows" },
                  onSpawn: (command) => {
                    spawned = command;
                  },
                  onUnref: () => {
                    didUnref = true;
                  },
                }),
              ),
            );
          });

          '''
          if case not in text:
            if anchor not in text:
              raise SystemExit('externalLauncher test anchor not found')
            text = text.replace(anchor, case + anchor, 1)
          test.write_text(text, encoding='utf-8')

          ws = Path('apps/server/src/ws.ts')
          text = ws.read_text(encoding='utf-8')
          old = 'onOpenUrl: (url) => externalLauncher.launchBrowser(url).pipe(Effect.ignore),'
          new = '''onOpenUrl: (url) =>
                    externalLauncher.launchBrowser(url).pipe(
                      Effect.tapError((error) =>
                        Effect.logWarning("Could not open omp login URL in the server browser.").pipe(
                          Effect.annotateLogs({ errorTag: error._tag }),
                        ),
                      ),
                      Effect.ignore,
                    ),'''
          if old not in text:
            raise SystemExit('ws omp login browser anchor not found')
          ws.write_text(text.replace(old, new, 1), encoding='utf-8')
      - name: Format
        run: vp fmt apps/server/src/process/externalLauncher.ts apps/server/src/process/externalLauncher.test.ts apps/server/src/ws.ts apps/web/src/rpc/requestLatencyState.ts apps/web/src/rpc/requestLatencyState.test.ts
      - name: Targeted tests
        run: vp test run apps/server/src/process/externalLauncher.test.ts apps/web/src/rpc/requestLatencyState.test.ts
      - name: Typecheck
        run: vpr typecheck
      - name: Commit
        run: |
          git config user.name github-actions[bot]
          git config user.email 41898282+github-actions[bot]@users.noreply.github.com
          git add apps/server/src/process/externalLauncher.ts apps/server/src/process/externalLauncher.test.ts apps/server/src/ws.ts apps/web/src/rpc/requestLatencyState.ts apps/web/src/rpc/requestLatencyState.test.ts
          if git diff --cached --quiet; then
            exit 0
          fi
          git commit -m "fix(omp): reliably launch interactive login browser"
          git push origin HEAD:test/ru-i18n-omp-telemetry-direct
