name: Apply Russian localization follow-up

on:
  push:
    branches:
      - i18n-followup-staging4
    paths:
      - .github/ru-followup.py

permissions:
  contents: write

jobs:
  apply:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: pnpm/action-setup@v4
        with:
          version: 11.10.0
      - uses: actions/setup-node@v4
        with:
          node-version: 24.13.1
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      - run: python .github/ru-followup.py
      - run: pnpm exec vp test run apps/web/src/i18n.test.ts apps/desktop/src/shell/DesktopShellEnvironment.test.ts
      - run: pnpm run typecheck
      - run: git diff --check
      - name: Commit clean result
        run: |
          rm -f .github/ru-followup.py .github/workflows/apply-ru-followup.yml
          git config user.name github-actions[bot]
          git config user.email 41898282+github-actions[bot]@users.noreply.github.com
          git add -A
          git commit -m "feat(i18n): expand Russian UI coverage" || exit 0
          git push
