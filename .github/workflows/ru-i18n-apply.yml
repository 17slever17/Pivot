name: Apply Russian localization

on:
  push:
    branches:
      - ru-i18n
    paths:
      - .github/ru-i18n-parts/**
      - .github/ru-i18n-test.txt
      - .github/workflows/ru-i18n-apply.yml
  pull_request:
    branches:
      - main
    paths:
      - .github/ru-i18n-parts/**
      - .github/ru-i18n-test.txt
      - .github/workflows/ru-i18n-apply.yml

permissions:
  contents: write

jobs:
  apply:
    name: Apply and verify
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    steps:
      - name: Checkout
        uses: actions/checkout@v6
        with:
          ref: ru-i18n
          fetch-depth: 0

      - name: Setup Vite+
        uses: voidzero-dev/setup-vp@v1
        with:
          node-version-file: package.json
          cache: true
          run-install: true

      - name: Assemble localization patcher
        run: cat .github/ru-i18n-parts/part*.pyfrag > "$RUNNER_TEMP/apply_pivot_ru_i18n.py"

      - name: Apply localization
        run: python "$RUNNER_TEMP/apply_pivot_ru_i18n.py" --repo "$GITHUB_WORKSPACE"

      - name: Update desktop client settings fixture
        run: |
          python - <<'PY'
          from pathlib import Path

          path = Path("apps/desktop/src/settings/DesktopClientSettings.test.ts")
          text = path.read_text(encoding="utf-8")
          old = '  diffIgnoreWhitespace: true,\n  environmentIdentificationMode: "artwork",\n'
          new = '  diffIgnoreWhitespace: true,\n  displayLanguage: "ru",\n  environmentIdentificationMode: "artwork",\n'
          if new not in text:
              if text.count(old) != 1:
                  raise SystemExit("DesktopClientSettings fixture anchor did not match exactly once")
              text = text.replace(old, new, 1)
          path.write_text(text, encoding="utf-8")
          PY

      - name: Run targeted tests
        run: vp test run packages/contracts/src/settings.test.ts apps/web/src/i18n.test.ts

      - name: Check diff
        run: git diff --check

      - name: Remove bootstrap files
        run: |
          rm -rf .github/ru-i18n-parts
          rm -f .github/ru-i18n-test.txt
          rm -f .github/workflows/ru-i18n-apply.yml

      - name: Commit localization
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -A
          git status --short
          git commit -m "feat(i18n): add Russian UI localization"
          git push origin HEAD:ru-i18n
