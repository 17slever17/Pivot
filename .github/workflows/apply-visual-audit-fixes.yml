name: Apply visual audit fixes

on:
  push:
    branches:
      - test/ru-i18n-omp-telemetry-direct

permissions:
  contents: write

jobs:
  apply:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v6
        with:
          ref: test/ru-i18n-omp-telemetry-direct
          fetch-depth: 0
      - uses: voidzero-dev/setup-vp@v1
        with:
          node-version-file: package.json
          cache: true
          run-install: true
      - name: Apply patch
        run: python3 scripts/apply_visual_audit_fixes_v2.py
      - name: Format changed files
        shell: bash
        run: |
          vp exec oxfmt \
            apps/web/src/components/Sidebar.tsx \
            apps/web/src/components/capabilities/CapabilityItemsPanel.tsx \
            apps/web/src/components/settings/SettingsRuntimeLocalization.tsx \
            apps/web/src/i18n/runtimeRuVisualAudit.ts \
            packages/client-runtime/src/rpc/client.test.ts \
            packages/client-runtime/src/state/threads.ts
      - name: Focused tests
        run: vp test run apps/web/src/components/threadActionMenu.logic.test.ts packages/client-runtime/src/rpc/client.test.ts
      - name: Check
        run: vp check
      - name: Commit fixes
        shell: bash
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add apps/web/src/components/Sidebar.tsx \
            apps/web/src/components/capabilities/CapabilityItemsPanel.tsx \
            apps/web/src/components/settings/SettingsRuntimeLocalization.tsx \
            apps/web/src/i18n/runtimeRuVisualAudit.ts \
            packages/client-runtime/src/rpc/client.test.ts \
            packages/client-runtime/src/state/threads.ts
          git commit -m "fix(i18n): finish descriptions archive and stale-thread retry"
          git push --no-verify origin HEAD:test/ru-i18n-omp-telemetry-direct
