name: Format Settings i18n follow-up

on:
  pull_request:
    branches:
      - test/ru-i18n-omp-telemetry
    paths:
      - apps/web/src/components/settings/SettingsRuntimeLocalization.tsx
      - .github/workflows/format-settings-i18n.yml

permissions:
  contents: write

jobs:
  format:
    if: github.head_ref == 'test/ru-i18n-omp-telemetry-direct'
    runs-on: ubuntu-24.04
    steps:
      - name: Checkout head branch
        uses: actions/checkout@v6
        with:
          ref: ${{ github.head_ref }}
      - name: Setup Vite+
        uses: voidzero-dev/setup-vp@v1
        with:
          node-version-file: package.json
          cache: true
          run-install: true
      - name: Format
        run: vp check --fix
      - name: Commit formatting
        shell: bash
        run: |
          if git diff --quiet; then
            exit 0
          fi
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add apps/web/src/components/settings/SettingsRuntimeLocalization.tsx apps/web/src/routes/settings.tsx
          git commit -m "style: format settings localization"
          git push origin HEAD:${{ github.head_ref }}
