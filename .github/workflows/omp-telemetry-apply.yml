name: Apply OMP subagent telemetry

on:
  push:
    branches:
      - feat/omp-subagent-telemetry
    paths:
      - .github/workflows/omp-telemetry-apply.yml
  pull_request:
    branches:
      - main
    paths:
      - .github/workflows/omp-telemetry-apply.yml

permissions:
  contents: write

jobs:
  apply:
    name: Apply and verify telemetry
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    steps:
      - name: Checkout
        uses: actions/checkout@v6
        with:
          ref: feat/omp-subagent-telemetry
          fetch-depth: 0

      - name: Setup Vite+
        uses: voidzero-dev/setup-vp@v1
        with:
          node-version-file: package.json
          cache: true
          run-install: true

      - name: Apply telemetry patch
        run: python .github/omp-telemetry-patch.py

      - name: Run focused tests
        run: >-
          vp test run
          apps/server/src/provider/omp/OmpAdapter.test.ts
          apps/server/src/orchestration/Layers/ProviderRuntimeIngestion.activity.test.ts
          packages/client-runtime/src/state/subagentRuntime.test.ts
          apps/web/src/components/AgentsPanel.transcript.test.ts

      - name: Validate diff
        run: git diff --check

      - name: Remove bootstrap files
        run: |
          rm -f .github/omp-telemetry-patch.py
          rm -f .github/workflows/omp-telemetry-apply.yml

      - name: Commit formatted telemetry changes
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -A
          git status --short
          git commit -m "feat(agents): surface richer OMP subagent telemetry"

      - name: Typecheck
        run: vpr typecheck

      - name: Push verified commit
        run: git push --no-verify origin HEAD:feat/omp-subagent-telemetry
