name: Format final localization catalog

on:
  push:
    branches:
      - test/ru-i18n-omp-telemetry-direct

permissions:
  contents: write

jobs:
  format:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v6
        with:
          ref: test/ru-i18n-omp-telemetry-direct
      - uses: voidzero-dev/setup-vp@v1
        with:
          node-version-file: package.json
          cache: true
          run-install: true
      - name: Format final catalog
        run: vp fmt apps/web/src/i18n/runtimeRuFinalPolish.ts --write
      - name: Commit formatted catalog
        shell: bash
        run: |
          if git diff --quiet; then
            exit 0
          fi
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add apps/web/src/i18n/runtimeRuFinalPolish.ts
          git commit -m "style(i18n): format final Russian catalog"
          git push --no-verify origin HEAD:test/ru-i18n-omp-telemetry-direct
