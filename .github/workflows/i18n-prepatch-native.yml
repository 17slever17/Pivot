name: Prepatch native menu labels

on:
  pull_request:
    branches:
      - test/ru-i18n-omp-telemetry

permissions:
  contents: write

jobs:
  patch:
    if: github.head_ref == 'test/ru-i18n-omp-telemetry-direct'
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v6
        with:
          ref: ${{ github.head_ref }}
      - name: Patch repeated native menu labels
        shell: bash
        run: |
          python3 - <<'PY'
          from pathlib import Path
          path = Path("apps/desktop/src/window/DesktopApplicationMenu.ts")
          text = path.read_text(encoding="utf-8")
          pairs = [
              ('label: "Check for Updates..."', 'label: "Проверить обновления..."', 2),
              ('label: "Settings..."', 'label: "Настройки..."', 2),
          ]
          for old, new, expected in pairs:
              count = text.count(old)
              if count == expected:
                  text = text.replace(old, new)
              elif count == 0 and text.count(new) == expected:
                  pass
              else:
                  raise SystemExit(f"Unexpected occurrence count for {old!r}: {count}")
          path.write_text(text, encoding="utf-8")
          PY
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add apps/desktop/src/window/DesktopApplicationMenu.ts
          if git diff --cached --quiet; then
            exit 0
          fi
          git commit -m "feat(i18n): localize repeated native menu labels"
          git push --no-verify origin HEAD:${{ github.head_ref }}
